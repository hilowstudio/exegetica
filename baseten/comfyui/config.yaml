# ComfyUI on Baseten for the Media Studio's self-hosted route (docs/decisions/0017-image-studio.md).
# One H100 that scales to zero when idle. Requests reach ComfyUI's own API through
# https://model-<id>.api.baseten.co/environments/production/sync/<comfy route>.
# Deploy: baseten/README.md
model_name: exegetica-comfyui
python_version: py312
base_image:
  image: python:3.12-slim-bookworm
  python_executable_path: /usr/local/bin/python3
# Triton compiles small GPU kernels while a job runs and needs a C compiler for them.
system_packages:
  - build-essential
build_commands:
  - curl -fsSL https://github.com/Comfy-Org/ComfyUI/archive/refs/tags/v0.44.0.tar.gz | tar -xz -C /app && mv /app/ComfyUI-0.44.0 /app/ComfyUI
  - pip install --no-cache-dir torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu130
  - pip install --no-cache-dir -r /app/ComfyUI/requirements.txt
  # The studio's own nodes (data/custom_nodes/exegetica): the prompt rewriter, which loads its
  # model with accelerate, and the clip tail and join that extend a video.
  - pip install --no-cache-dir accelerate
  - cp -r /app/data/custom_nodes/exegetica /app/ComfyUI/custom_nodes/
  # ComfyUI-Hyperflow v1.3.2 (Apache-2.0), which applies HyperFlow to H3; its weights are mounted below.
  - curl -fsSL https://github.com/Saganaki22/ComfyUI-Hyperflow/archive/6ec22a6910c9035c6bbbc04296d8f19f7d61db36.tar.gz | tar -xz -C /app/ComfyUI/custom_nodes && mv /app/ComfyUI/custom_nodes/ComfyUI-Hyperflow-6ec22a6910c9035c6bbbc04296d8f19f7d61db36 /app/ComfyUI/custom_nodes/ComfyUI-Hyperflow
  - sed -i 's/\r$//' /app/data/start.sh /app/data/extra_model_paths.yaml
docker_server:
  start_command: sh /app/data/start.sh
  server_port: 8188
  predict_endpoint: /prompt
  readiness_endpoint: /system_stats
  liveness_endpoint: /system_stats
resources:
  accelerator: H100
  use_gpu: true
runtime:
  # ComfyUI queues the work itself. This only lets status checks through while a video renders.
  predict_concurrency: 8
# MiniMax H3, the files Comfy's own templates load: fl2va for words, first and last frames and
# stills, ref2va for reference pictures and pinned frames. About 63 GB, read-only at runtime.
weights:
  - source: hf://Comfy-Org/MiniMax-H3@54472221d27c695fca9621b0c3ed52f06c4af707
    mount_location: /models/minimax-h3
    allow_patterns:
      - diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
      - diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors
      - text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
      - vae/minimax_h3_video_vae_int8_convrot.safetensors
      - vae/minimax_h3_audio_vae_fp32.safetensors
      - loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
  # P-H3-Image, H3's image model, as a LoRA on the fl2va weights above plus its own text encoder
  # and VAE: text-to-image and edits with up to eight pictures. About 10 GB.
  - source: hf://PrunaAI/P-H3-Image-Comfy@44a0fb73f299da1bb715bdb5ff59ce3fd3c6f543
    mount_location: /models/p-h3-image
    allow_patterns:
      - loras/p-h3-image_lora_bf16.safetensors
      - text_encoders/p-h3-image_text_encoder_int8_convrot.safetensors
      - vae/p-h3-image_vae_int8_convrot.safetensors
  # HyperFlow, Video Rebirth's 8-step adapter for H3, in the build for pruned weights like ours.
  # About 3.6 GB.
  - source: hf://drbaph/Hyperflow-Comfyui@2cea953918c1f800e4d6d15304d65947b220ddc7
    mount_location: /models/hyperflow
    allow_patterns:
      - custom_node_hyperflow_8step_v1.0_comfyui_pruned.safetensors
  # The prompt rewriter for runs on this GPU: a Qwen3-8B, 16 GB.
  - source: hf://Goekdeniz-Guelmez/Josiefied-Qwen3-8B-abliterated-v1@2d21f18902f23a729934a9631373297e22e1ff25
    mount_location: /models/rewriter
    allow_patterns:
      - "*.safetensors"
      - "*.json"
      - merges.txt
      - vocab.json
