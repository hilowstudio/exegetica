{% extends "base.html" %}
{% block title %}Scripture Memory · Exegetica{% endblock %}
{% block styles %}<link rel="stylesheet" href="/static/css/memory.css">{% endblock %}
{% block content %}
<div class="app">

  <aside class="side" id="side" aria-label="Your verses">
    <div class="side-h">
      <div class="side-top"><span>Your verses</span><button class="side-x" id="drawer-close" type="button" title="Hide verses" aria-label="Hide your verses" aria-controls="side">&times;</button></div>
      <button class="newbtn" id="drawer-add"><span style="font-size:15px;line-height:1">＋</span> Add verse</button>
      <button class="btn ghost" id="drawer-lib" style="width:100%">Browse library</button>
    </div>
    <div class="side-body" id="verse-list"></div>
  </aside>

  <div class="col">
    <div class="top">
      <button class="icobtn" id="menu-btn" type="button" aria-label="Show verses" title="Show verses"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1>Scripture Memory</h1>
      <span class="sub" id="topsub">Hide his word in your heart</span>
      <span class="sp"></span>
      <div id="topactions"></div>
    </div>
    <div class="scroll"><div class="wrap shell-col" id="view"></div></div>
  </div>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="trash" id="trash"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13h10l1-13"/></svg> Drop here to delete</div>
<div class="toast" id="toast"></div>
{% endblock %}
{% block scripts %}<script src="/static/profanity.js"></script>
<script src="/static/js/memory.js"></script>{% endblock %}
