# =============================================================================
# Format recommendations — the bridge between the K-12 standards spine and the
# resource-generator formats (resource-generators.yaml).
#
# When an instructor lands on a standard, the app suggests fitting formats.
# Resolution (most specific wins, then union with `universal`):
#   recommended(sub_subject_id) = by_sub_subject[ssid]  or  by_subject[subject]
#                                 , then + universal (deduped, specific first)
#
# All ids reference `formats[].id` in resource-generators.yaml. Editable.
# =============================================================================

# Fit almost any objective in any subject (always offered, after the specific set).
universal: [faith_integration, worksheet, quiz, flashcards, study_guide, discussion_questions, graphic_organizer, comparison_matrix, explainer_sheet]

# Broad default palette per subject (fallback when a sub_subject isn't listed).
by_subject:
  ART: [biography_profile, timeline, comparison_matrix, listening_guide, art_technique_tutorial, project_guide, fact_sheet, explainer_sheet, rubric]
  BIB: [inductive_passage_study, book_survey, character_study, comparison_matrix, discussion_questions, timeline, explainer_sheet, quiz, study_guide, confession_study]
  CFL: [vocabulary_list, flashcards, reference_chart, translation_worksheet, drill_set, grammar_practice, quiz, word_study]
  CPT: [explainer_sheet, worksheet, how_to_guide, project_guide, checklist, case_study, discussion_questions, timeline]
  DST: [engineering_design, project_guide, how_to_guide, labeled_diagram, checklist, project_planner, rubric, fact_sheet]
  ELA: [close_reading_guide, writing_prompt_set, essay_assignment, comparison_matrix, discussion_questions, reading_comprehension_set, grammar_practice, vocabulary_list, outline_template, story_map]
  # (ELA.12 Informational & Expository Reading — see by_sub_subject below)
  GEO: [annotated_map, fact_sheet, comparison_matrix, data_analysis, labeled_diagram, timeline, field_observation, reflection_journal]
  HPE: [explainer_sheet, fact_sheet, how_to_guide, checklist, tracker, case_study, discussion_questions, reflection_journal, comparison_matrix, rubric]
  HSS: [timeline, biography_profile, annotated_map, comparison_matrix, close_reading_guide, case_study, discussion_questions, essay_assignment]
  LIF: [project_guide, how_to_guide, planner_template, checklist, tracker, case_study, project_planner, explainer_sheet]
