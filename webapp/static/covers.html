<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magazine Covers — Exegetica</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/fonts/covers.css">
<style>
  :root{
    --paper:#f0e8dc; --surface:#f8f2ea; --surface-2:#e9e0d1; --sunk:#e2d7c6; --ink:#1e2026;
    --ink-soft:#54596a; --ink-faint:#8b8f9b; --rule:#ddd3c1; --rule-strong:#c9bda6;
    --accent:#c05a64; --iron:#42718a; --brass:#9a7c3d; --ok:#3f7d4e;
    --serif:"Spectral",Georgia,serif; --sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#14151a; --surface:#1b1d23; --surface-2:#23252c; --sunk:#101116; --ink:#e9e7e0;
    --ink-soft:#a9aeb9; --ink-faint:#787d88; --rule:#2c2f37; --rule-strong:#3b3f49;
    --accent:#dd8089; --iron:#7fb0c2; --brass:#c7a45f; --ok:#7cc08c;
  }}
  :root[data-theme="dark"]{
    --paper:#14151a; --surface:#1b1d23; --surface-2:#23252c; --sunk:#101116; --ink:#e9e7e0;
    --ink-soft:#a9aeb9; --ink-faint:#787d88; --rule:#2c2f37; --rule-strong:#3b3f49;
    --accent:#dd8089; --iron:#7fb0c2; --brass:#c7a45f; --ok:#7cc08c;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--iron);text-decoration:none} a:hover{text-decoration:underline}
  button,select{font-family:inherit}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 20px;
    background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
  .tb-back{font-family:var(--mono);font-size:12px;color:var(--iron)}
  .tb-title{flex:1;text-align:center;font-family:var(--serif);font-weight:600}
  .tb-spacer{width:70px}
  .wrap{max-width:1240px;margin:0 auto;padding:30px 24px 140px}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:var(--serif);font-weight:600;font-size:2.3rem;line-height:1.1;margin:.15em 0 .3em}
  .lede{max-width:68ch;color:var(--ink-soft);margin:0 0 22px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:var(--surface);color:var(--ink-soft);padding:7px 12px;font-size:13px;cursor:pointer}
  .seg button+button{border-left:1px solid var(--rule-strong)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  select{padding:7px 10px;border:1px solid var(--rule-strong);border-radius:9px;background:var(--surface);color:var(--ink);font-size:13px}
  .lnk{border:0;background:none;color:var(--iron);font-size:13px;cursor:pointer;padding:4px 2px}
  .count{font-family:var(--mono);font-size:12px;color:var(--ink-faint);margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-top:20px}
  .card{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding:12px;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .covers{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr;gap:10px;align-items:end}
  .cv{display:flex;flex-direction:column;gap:4px;min-width:0}
  .cv .fr{aspect-ratio:2/3;background:var(--sunk);border-radius:6px;overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--rule)}
  .cv img{width:100%;height:100%;object-fit:cover;display:block}
  .cv .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  .cv.now img{opacity:.85}
  .cv.new .fr{cursor:pointer}
  .none{font-size:11px;color:var(--ink-faint);padding:6px;text-align:center}
  .pick{grid-row:2;align-self:start;margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
  .meta{grid-row:2;min-width:0}
  .t{font-family:var(--serif);font-weight:600;line-height:1.25}
  .a{font-family:var(--serif);font-style:italic;color:var(--ink-soft);font-size:.92rem}
  .iss{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:4px}
  .alts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .alts button{font-size:11px;padding:3px 8px;border:1px solid var(--rule-strong);border-radius:6px;background:transparent;color:var(--ink-soft);cursor:pointer}
  .alts button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
  .badge{display:inline-block;margin-top:6px;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-soft)}
  .state{font-size:12px;margin-top:6px}
  .state.ok{color:var(--ok)} .state.bad{color:var(--accent)}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:16px;justify-content:center;
    padding:14px 20px;background:var(--surface);border-top:1px solid var(--rule-strong);box-shadow:0 -10px 30px -20px rgba(0,0,0,.4)}
  .dock .prog{font-size:13px;color:var(--ink-soft);min-width:0}
  .go{padding:10px 18px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
  .go:disabled{opacity:.5;cursor:default}
  .msg{padding:60px 0;text-align:center;color:var(--ink-soft)}
  :focus-visible{outline:2px solid var(--iron);outline-offset:2px}
  @media (max-width:640px){
    .wrap{padding:20px 16px 150px} h1{font-size:1.8rem}
    .grid{grid-template-columns:1fr}
    .count{margin-left:0;width:100%}
    .dock{flex-direction:column;gap:8px}
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="tb-back" href="/read">‹ Library</a>
  <div class="tb-title">Magazine covers</div>
  <div class="tb-spacer"></div>
</header>
<main class="wrap">
  <div class="kicker">Reading Room · admin</div>
  <h1>Original magazine covers</h1>
  <p class="lede" id="lede">These stories name the magazine issue they were transcribed from. Each card shows the book's cover now and that issue's cover. Pick the ones you want and apply them together.</p>
  <div class="bar" id="bar" hidden>
    <div class="seg" role="group" aria-label="Show">
      <button type="button" data-show="needs" aria-pressed="true">Without a custom cover</button>
      <button type="button" data-show="all" aria-pressed="false">All</button>
    </div>
    <select id="mag" aria-label="Magazine"><option value="">All magazines</option></select>
    <button class="lnk" id="selAll" type="button">Select all shown</button>
    <button class="lnk" id="selNone" type="button">Clear selection</button>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
  <p class="msg" id="msg">Loading…</p>
</main>
<div class="dock" id="dock" hidden>
  <span class="prog" id="prog" role="status" aria-live="polite"></span>
  <button class="go" id="go" type="button" disabled>Apply covers</button>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  try { var t = localStorage.getItem("exeg-theme"); if(t) document.documentElement.setAttribute("data-theme", t); } catch(e){}
  var items = [], bySlug = {}, show = "needs", mag = "", busy = false;

  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function visible(){ return items.filter(function(it){
    return (show === "all" || !it.custom || it.done) && (!mag || it.mag === mag); }); }
  function selected(){ return items.filter(function(it){ return it.sel && !it.done; }); }

  function img(src, alt){
    var i = el("img"); i.alt = alt || ""; i.loading = "lazy"; i.referrerPolicy = "no-referrer"; i.src = src;
    i.onerror = function(){ var n = el("div", "none", "No preview"); i.replaceWith(n); };
    return i;
  }
  function card(it){
    var c = el("article", "card" + (it.sel ? " sel" : "")); c.dataset.slug = it.slug;
    var covers = el("div", "covers"), now = el("div", "cv now"), nw = el("div", "cv new");
    var f1 = el("div", "fr"); if(it.current){ f1.appendChild(img(it.current, "Current cover")); } else { f1.appendChild(el("div", "none", "No cover")); }
    now.appendChild(f1); now.appendChild(el("span", "lbl", "Now"));
    var cand = it.candidates[it.pick], f2 = el("div", "fr");
    f2.appendChild(img(cand.thumb, it.issue)); f2.title = "Select or deselect";
    f2.addEventListener("click", function(){ toggle(it); });
    nw.appendChild(f2); nw.appendChild(el("span", "lbl", cand.domain));
    covers.appendChild(now); covers.appendChild(nw);
    var cb = el("input", "pick"); cb.type = "checkbox"; cb.checked = !!it.sel; cb.disabled = !!it.done;
    cb.setAttribute("aria-label", "Use the magazine cover for " + it.title);
    cb.addEventListener("change", function(){ toggle(it, cb.checked); });
    var m = el("div", "meta");
    m.appendChild(el("div", "t", it.title));
    if(it.author) m.appendChild(el("div", "a", it.author));
    m.appendChild(el("div", "iss", it.issue));
    if(it.candidates.length > 1){
      var alts = el("div", "alts");
      it.candidates.forEach(function(cd, i){
        var b = el("button", null, cd.domain); b.type = "button"; b.setAttribute("aria-pressed", i === it.pick ? "true" : "false");
        b.addEventListener("click", function(){ it.pick = i; redraw(it); });
        alts.appendChild(b);
      });
      m.appendChild(alts);
    }
    if(it.custom && !it.done) m.appendChild(el("span", "badge", "Custom cover" + (it.custom_source ? ": " + it.custom_source : "")));
    if(it.state) m.appendChild(el("div", "state " + (it.stateCls || ""), it.state));
    c.appendChild(covers); c.appendChild(cb); c.appendChild(m);
    return c;
  }
  function redraw(it){ var old = document.querySelector('.card[data-slug="' + CSS.escape(it.slug) + '"]'); if(old) old.replaceWith(card(it)); summary(); }
  function toggle(it, on){ if(it.done || busy) return; it.sel = on == null ? !it.sel : on; redraw(it); }
  function render(){
    var v = visible(); $("grid").replaceChildren.apply($("grid"), v.map(card));
    $("msg").hidden = !!v.length; if(!v.length) $("msg").textContent = "Nothing to review here.";
    summary();
  }
  function summary(){
    var v = visible(), s = selected();
    $("count").textContent = v.length + " shown · " + s.length + " selected";
    $("go").textContent = "Apply " + s.length + (s.length === 1 ? " cover" : " covers");
    $("go").disabled = busy || !s.length;
  }

  function apply(){
    var queue = selected(), total = queue.length, done = 0, failed = 0;
    if(!total) return;
    busy = true; summary();
    function next(){
      var it = queue.shift(); if(!it) return Promise.resolve();
      var cd = it.candidates[it.pick];
      it.state = "Saving…"; it.stateCls = ""; redraw(it);
      return fetch("/api/reading/cover", {method:"PUT", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({slug: it.slug, cover_url: cd.image, source: cd.source, source_page: cd.page || ""})})
        .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return {ok:r.ok, j:j}; }); })
        .then(function(res){
          if(res.ok){ it.done = true; it.sel = false; it.current = res.j.cover; it.state = "Applied"; it.stateCls = "ok"; }
          else { failed++; it.state = it.candidates.length > 1 ? "Couldn't download it. Try the other source." : "Couldn't download it. Try again later."; it.stateCls = "bad"; }
        })
        .catch(function(){ failed++; it.state = "Couldn't reach the server."; it.stateCls = "bad"; })
        .then(function(){ done++; redraw(it); $("prog").textContent = "Applied " + (done - failed) + " of " + total + (failed ? " · " + failed + " failed" : ""); return next(); });
    }
    $("prog").textContent = "Applying " + total + "…";
    Promise.all([next(), next(), next()]).then(function(){   // three at a time
      busy = false; summary();
      $("prog").textContent = "Done: " + (total - failed) + " applied" + (failed ? ", " + failed + " failed (still selectable to retry)" : "") + ".";
      items.forEach(function(it){ if(!it.done && it.stateCls === "bad") it.sel = true; });
      render();
    });
  }

  document.querySelectorAll("[data-show]").forEach(function(b){
    b.addEventListener("click", function(){
      show = b.dataset.show;
      document.querySelectorAll("[data-show]").forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      render();
    });
  });
  $("mag").addEventListener("change", function(){ mag = this.value; render(); });
  $("selAll").addEventListener("click", function(){ if(busy) return; visible().forEach(function(it){ if(!it.done) it.sel = true; }); render(); });
  $("selNone").addEventListener("click", function(){ if(busy) return; items.forEach(function(it){ it.sel = false; }); render(); });
  $("go").addEventListener("click", function(){
    var n = selected().length;
    if(window.confirm("Download " + n + (n === 1 ? " cover" : " covers") + " and make " + (n === 1 ? "it the book's" : "them the books'") + " cover art?")) apply();
  });

  fetch("/api/reading/cover/review").then(function(r){
    if(r.status === 403){ throw new Error("forbidden"); }
    return r.json();
  }).then(function(d){
    items = d.items.map(function(it){
      it.mag = it.issue.split(",")[0]; it.pick = 0; it.sel = !it.custom; return it;
    });
    var mags = {}; items.forEach(function(it){ mags[it.mag] = (mags[it.mag] || 0) + 1; });
    Object.keys(mags).sort().forEach(function(k){ var o = el("option", null, k + " (" + mags[k] + ")"); o.value = k; $("mag").appendChild(o); });
    $("bar").hidden = false; $("dock").hidden = false;
    render();
  }).catch(function(e){
    $("msg").textContent = e.message === "forbidden" ? "Sign in as a library admin to review covers." : "Couldn't load the covers. Try again shortly.";
  });
})();
</script>
</body>
</html>
