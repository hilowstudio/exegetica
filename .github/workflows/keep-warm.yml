name: Keep Exegetica warm

# Pings the app on a schedule so Fly's scale-to-zero doesn't leave it cold when a real
# user arrives (a cold start re-fetches the SQLite DBs from R2 and can 502 for a minute+).
# NOTE: GitHub's scheduled runs are best-effort and often delayed 5-15 min under load, so
# this reduces — but doesn't eliminate — cold-start 502s. The reliable (but always-on-cost)
# alternative is min_machines_running = 1 in fly.toml.

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may fire late / skip under load)
  workflow_dispatch: {}      # allow manual "wake it now" runs

# Never pile up overlapping pings if a run is slow (cold start).
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPS_FLAG_TOKEN: ${{ secrets.OPS_FLAG_TOKEN }}   # job level, so a step's `if` can read it
    steps:
      - name: Ping /api/config (wakes + warms the machine)
        run: |
          # Retry to ride out a cold start (DB re-fetch from R2 can take ~1-2 min).
          curl -fsS --retry 6 --retry-all-errors --retry-delay 15 --max-time 120 \
            -o /dev/null -w "warmed: HTTP %{http_code} in %{time_total}s\n" \
            https://exegetica.app/api/config

      # The libraries answer a ping (webapp/app.py health). A machine still waking can take a while,
      # so this retries; a failure that outlasts the retries fails the run, and GitHub emails.
      - name: Check the libraries (/api/health)
        run: |
          curl -fsS --retry 4 --retry-all-errors --retry-delay 15 --max-time 60 \
            -o /dev/null -w "health: HTTP %{http_code}\n" \
            https://exegetica.app/api/health

      # Once a UTC day, if estimated spend passes $5, /ops/flag answers 500 and this run fails,
      # so GitHub emails the maker (webapp/ops.py). It also drives the metrics purge. Skipped
      # until the OPS_FLAG_TOKEN secret is set here and on Fly.
      - name: Spend alert (/ops/flag)
        if: ${{ env.OPS_FLAG_TOKEN != '' }}
        run: |
          curl -fsS --max-time 60 -H "X-Ops-Token: $OPS_FLAG_TOKEN" https://exegetica.app/ops/flag
